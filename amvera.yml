meta:
  environment: golang
  toolchain:
    name: go
    version: "1.22"

build:
  commands:
    build:
      - go mod download
      - go build -o app cmd/api/main.go

run:
  persistenceMount: /data
  containerPort: 8080

env:
  - name: AMVERA
    value: "true"
  - name: DB_PATH
    value: /data/fuel-points.db
  - name: SERVER_PORT
    value: "8080"
