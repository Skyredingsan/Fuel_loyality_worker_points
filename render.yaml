services:
  - type: web
    name: fuel-loyality-worker-points
    runtime: go
    buildCommand: go build -mod=vendor -o fuel-points cmd/api/main.go
    startCommand: go run scripts/ensure_users.go && ./fuel-points
    envVars:
      - key: DB_PATH
        value: ./data/fuel-points.db
      - key: SERVER_PORT
        value: 8080
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1